# Copy to secrets.toml locally, or paste into deployed Streamlit app Secrets.
# Never commit real secrets.toml. No recipient is hardcoded in application code.
[emergency]
provider = "telegram"
bot_token = "YOUR_TEST_BOT_TOKEN"
chat_id = "YOUR_AUTHORIZED_TEST_CHAT_ID"

[rtc_configuration]
iceServers = [{urls = ["stun:stun.l.google.com:19302"]}]
# Some networks require your own authenticated TURN server as well.
# iceServers = [{urls = ["turn:turn.example.org:3478"], username = "USER", credential = "SECRET"}]
